[project]
name = "prd-toolkit"
version = "0.1.0"
description = "Lint, trace and status scripts for living PRD folders"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "sqlglot>=25",
    "openapi-spec-validator>=0.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
norecursedirs = ["fixtures", "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}"]
