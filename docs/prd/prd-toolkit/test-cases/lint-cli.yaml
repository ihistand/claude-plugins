  ac: AC-002.1
  level: integration
  target: cli:prd_lint
  environment: local
  identity: none
  preconditions: [lint-cli/orders, lint-cli/plugins_superpowers]
  input:
    setup: [S0, M1]
    cwd: <tmp>/docs
    command: python <repo>/prd-toolkit/scripts/prd_lint.py prd/orders
  expect:
    output:
      exit: 1
      stdout_contains_line: "prd/orders/contracts/errors.yaml:41: contracts-valid: duplicate key 'FORBIDDEN' (first at line 25, again at line 41)"
    effects: []
    errors: []
    leaks: none
