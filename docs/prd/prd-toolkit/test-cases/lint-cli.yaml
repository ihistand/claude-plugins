# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below:
#   <repo> is the repository root; <tmp> is the test's own tmp_path; <resolved tmp> is Path(<tmp>).resolve().
#   "python" is the interpreter running the tests (sys.executable), which has prd-toolkit/pyproject.toml's
#   dependencies; a CLI case runs `python <repo>/prd-toolkit/scripts/prd_lint.py ...` as a subprocess
#   (not `uv run`, whose own stderr lines would break the stderr assertions).
#   S0 = write each entry of fixture lint-cli/orders (contracts/fixtures/lint-cli/orders.yaml) to
#   <tmp>/docs/prd/orders/<key>, and set PRD_PLUGINS_FILE to the absolute path of fixture
#   lint-cli/plugins_superpowers.json (the registries rule reads it). With S0 alone the folder lints clean (T-001.1).
#   M1 = append the line `FORBIDDEN: {}` to <tmp>/docs/prd/orders/contracts/errors.yaml (it becomes line 41).
T-001.1:
  ac: AC-001.1
  level: integration
  target: cli:prd_lint
  environment: local
  identity: none
  preconditions: [lint-cli/orders, lint-cli/plugins_superpowers]
  input:
    setup: [S0]
    cwd: <tmp>
    command: python <repo>/prd-toolkit/scripts/prd_lint.py docs/prd/orders
  expect:
    output: {exit: 0, stdout: "", stderr: ""}
    effects: []
    errors: []
    leaks: none
T-001.2:
  ac: AC-001.2
  level: integration
  target: cli:prd_lint
  environment: local
  identity: none
  preconditions: [lint-cli/orders, lint-cli/plugins_superpowers]
  input:
    setup: [S0, M1]
    cwd: <tmp>
    command: python <repo>/prd-toolkit/scripts/prd_lint.py docs/prd/orders
  expect:
    output:
      exit: 1
      stdout_contains_line: "docs/prd/orders/contracts/errors.yaml:41: contracts-valid: duplicate key 'FORBIDDEN' (first at line 25, again at line 41)"
      stderr: ""
    effects: []
    errors: []
    leaks: none
T-001.3:
  ac: AC-001.3
  level: integration
  target: cli:prd_lint
  environment: local
  identity: none
  preconditions: [lint-cli/orders, lint-cli/plugins_superpowers]
  input:
    setup:
      - S0
      - "append the line `T-002.1: {}` to test-cases/api.yaml (it becomes line 68)"
      - "append the lines `IMPORT_EMPTY: {}` and `FORBIDDEN: {}` to contracts/errors.yaml (lines 41 and 42)"
    cwd: <tmp>
    command: python <repo>/prd-toolkit/scripts/prd_lint.py docs/prd/orders
    note: the loader reads test-cases/ before contracts/, so the printed order proves the sort
  expect:
    output:
      exit: 1
      stdout_lines_in_this_relative_order:
        - "docs/prd/orders/contracts/errors.yaml:41: contracts-valid: duplicate key 'IMPORT_EMPTY' (first at line 9, again at line 41)"
        - "docs/prd/orders/contracts/errors.yaml:42: contracts-valid: duplicate key 'FORBIDDEN' (first at line 25, again at line 42)"
        - "docs/prd/orders/test-cases/api.yaml:68: id-unique: duplicate key 'T-002.1' (first at line 1, again at line 68)"
      stderr: ""
    effects: []
    errors: []
    leaks: none
