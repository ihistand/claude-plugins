          glossary-synonym, id-format, id-removed-reused, id-unique, index-consistent, links-format,
          markers-open, nfr-bound, open-questions-empty, placeholder, production-gate, registries,
          runbook-env, runbook-steps, runbook-tests, schema-refs, sections, snapshot-cited, sufficiency,
          test-cases-consistent, test-level, test-refs, upstream-refs, vague-word]
    effects: []
    errors: []
