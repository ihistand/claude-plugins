# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below (they extend those of lint-cli.yaml):
#   <repo> is the repository root; <tmp> is the test's own tmp_path; <P> is <tmp>/docs/prd/orders.
#   S0 = write each entry of fixture lint-cli/orders (contracts/fixtures/lint-cli/orders.yaml) to <P>/<key>, creating
#   parent folders, and set PRD_PLUGINS_FILE to the absolute path of fixture lint-cli/plugins_superpowers.json.
#   With S0 alone the folder lints clean (T-001.1).
#   A file named in a setup step is relative to <P>. "line N of F" is line N of F as S0 wrote it, before any other
#   step of the case; "replace line N of F with X" keeps every other line; "insert X before line N of F" makes X line N;
#   "append X to F" adds X and a newline after F's final newline, so X becomes the line number the step names.
#   "texts.<key>" (a whole value, or an item of a list) stands for the string, or the list of strings, under <key> in
#   fixture lint-structure/texts (contracts/fixtures/lint-structure/texts.yaml, read with yaml.safe_load). Texts that a
#   lint of this PRD folder would itself report live there, because lint never reads fixture data.
#   A1 = write <P>/adoption.md as the lines "# Adoption map", "", "| Area | State | Boundary |", "|---|---|---|",
#        "| import | adopted | `features/import.md` |", each ending in a newline (the row is line 5).
#   stdout_not_contains: a string, or each string of a list, that stdout does not hold anywhere (the stdout twin of
#   stderr_not_contains). stdout_count_of_line: {line, count}: the number of stdout lines equal to line.
T-020.1:
  ac: AC-020.1
  level: integration
  target: cli:prd_lint
  environment: local
  identity: none
  preconditions: [lint-cli/orders, lint-cli/plugins_superpowers]
  input:
    setup: [S0, "delete line 5 of prd.md (owner: Sample Owner)"]
    cwd: <tmp>
    command: python <repo>/prd-toolkit/scripts/prd_lint.py docs/prd/orders
  expect:
    output: {exit: 1, stdout_contains_line: "docs/prd/orders/prd.md:1: frontmatter: missing key 'owner'", stderr: ""}
    effects: []
    errors: []
    leaks: none
