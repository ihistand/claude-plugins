# The custom contract type `cli` (prd.md §7): one top-level key per CLI script, each with its
# arguments, its output lines and its exit codes. Test cases target a script as `cli:<key>`.
prd_lint:
  invocation: "uv run --script prd-toolkit/scripts/prd_lint.py [--list-rules] [--list-packs] [--ci] [--sample-tids N] [--json] [--interface] [prd_dir]"
  arguments:
    "prd_dir": "the PRD folder; required unless --list-rules, --list-packs or --interface is given (FR-004)"
    "--list-rules": "print every registered rule and its severity, sorted, one per line; the folder is not read (FR-003)"
    "--list-packs": "print every pack on this machine, the toolkit's own first; the folder is not read (FR-013)"
    "--ci": "set PRD_LINT_CI=1 before the rules run (FR-008)"
    "--sample-tids N": "integer >= 0; print up to N random non-unit test cases instead of linting (FR-007)"
    "--json": "print the lint result as one JSON document instead of the finding lines; --json=1 is the same, any other --json=N is refused (FR-014)"
    "--interface": "print the interface number 1; the folder is not read and a --json=N is not checked (FR-014)"
    "-h, --help": "print the help to stdout (FR-004)"
  output:
    finding: "stdout: <path>:<line>: <rule>: <message>, sorted by file, line, rule; <path> per FR-002"
    warn_finding: "stdout: <path>:<line>: warn: <rule>: <message>, sorted with the findings (FR-001)"
    rule_name: "stdout, --list-rules: <name> <severity> per line, the severity error or warn"
    pack: "stdout, --list-packs: <name> <version> (<source>), then ' — <description>' when the pack has one (FR-013)"
    vendored_note: "stderr, --list-packs from a vendored copy: prd_lint: listed from the vendored copy: <names> is/are vendored in .prd-toolkit/packs/, each with the source it was vendored from; the plugin's own scripts/prd_lint.py --list-packs lists every pack on this machine (FR-013)"
    sample: "stdout, --sample-tids: <T-id> <test-case file relative to the folder>"
    usage: "stderr: usage: prd_lint.py [-h] [--list-rules] [--list-packs] [--ci] [--sample-tids N] [--json] [--interface] [prd_dir], one line whatever the terminal width"
    json_document: 'stdout, --json: one line, {"interface": 1, "kind": "lint", "prd", "version", "dir", "findings": [{"file", "line", "rule", "severity", "message"}], "errors", "warnings"} (FR-014)'
    json_error: 'stdout, --json on exit 2: one line, {"interface": 1, "kind": "lint", "error": <message>} (FR-014)'
    interface: "stdout, --interface: 1 (FR-014)"
    unsupported_interface: "stderr, --json=N with N other than 1 and no --interface: prd_lint: unsupported interface <N>; this toolkit speaks 1 (FR-014)"
    argparse_error: "stderr: usage line, then prd_lint.py: error: <argparse message>"
    negative_sample: "stderr: prd_lint: --sample-tids N must be >= 0"
    not_a_prd: "stderr: prd_lint: <resolved folder>: no prd.md, optionally followed by ; found <name>; the file name is lowercase prd.md"
    internal_error: "stderr: prd_lint: internal error: <exception type>: <message>"
    rule_crash: "stderr: prd_lint: internal error in rule <rule>: <exception type>: <message>"
    no_sample: "stderr: prd_lint: no non-unit T-ids to sample"
    missing_package: "stderr: prd_lint: missing Python package '<package>'. Run with: uv run --script <script> …, or: pip install pyyaml sqlglot openapi-spec-validator"
  encoding: "stdout and stderr are UTF-8 whatever the locale when run as a script (FR-009)"
  exit_codes:
    0: "clean lint or only warnings, --list-rules, --list-packs, --interface, --help, or a sample printed"
    1: "one or more error findings, or --sample-tids with no non-unit test case"
    2: "usage error, an unsupported --json=N without --interface, folder without prd.md, missing dependency, or internal error (load or rule)"
  structure_findings:
    frontmatter: "prd.md: missing key '<key>' | '<key>: <value>' <reason> | missing key 'sql-dialect' (required because contracts/schema.sql exists) | 'sql-dialect: <value>' is not a sqlglot dialect (<sqlglot error>) (FR-020)"
    language-table: "prd.md: language '<code>' has no table, or the language loader's reason (FR-021)"
    sections_headings: "prd.md: missing section '## <n>. <title>' | sections are out of order | unexpected section '## <n>. <title>' (FR-022)"
    sections_files: "<entry>:0 mandatory '<entry>' is missing | mandatory '<entry>' cannot be marked not applicable | '<slot>' is absent and section 1 has no 'Not applicable: `<slot>` — reason' line (FR-023)"
    sections_adoption: "section 8: the adoption map moved to adoption.md in prd-toolkit 0.3; ... | section 8 points at adoption.md but adoption.md does not exist | section 8 says \"Not applicable: new project\" but adoption.md exists | section 8 body must be \"See adoption.md.\" or \"Not applicable: new project.\" | adoption.md holds no '| Area | State | Boundary |' table | adoption.md table header must be '| Area | State | Boundary |', not '| <cells> |' | adoption state '<state>' for <area> must be one of not started, extracted, confirmed, adopted (FR-024)"
    sections_harness: "testing.md has no '## Harness' section with its slots | Harness slot '<slot>' is missing | Harness slots are out of order; the order is <the fifteen slots> | the Harness Layout slot has no 'Test roots:' text | Test roots: lists no backticked directory (FR-025)"
    placeholder: "placeholder '<text>' in prose; if this is literal text, put it in backticks | placeholder '<text>' in a YAML value (FR-027)"
    vague-word: "'<word>' with no measurable number on the line (FR-028)"
    markers-open: "the clarification marker's name in square brackets, then: left open while status is <status> (markers count in every text file, comments included; delete a template hint once its slot is answered) (FR-029)"
    assumption-indexed: "the word ASSUMPTION in square brackets, then: marker has no A-nn id | <A-id> has no row in section 12 | <A-id>: status '<status>' must be open, confirmed, corrected or awaiting <who> | <A-id> is open while the PRD is Approved (FR-030)"
    open-questions-empty: "section 13 must be 'None.' when the PRD is Approved (FR-031)"
    glossary-synonym: "'<text>' is a banned synonym; use '<term>' (FR-032)"
prd_publish:
  # Only what lint-cli's FR-010 needs so far; the publish area adds the rest when it is adopted.
  invocation: "uv run --script prd-toolkit/scripts/prd_publish.py <arguments>"
  output:
    missing_package: "stderr: prd_publish: missing Python package '<package>'. Run with: uv run --script prd_publish.py …, or: pip install pyyaml sqlglot openapi-spec-validator markdown-it-py (FR-010)"
  exit_codes:
    2: "missing dependency (FR-010)"
