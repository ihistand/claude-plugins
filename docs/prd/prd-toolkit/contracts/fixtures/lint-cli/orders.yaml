contracts/openapi.yaml: |
  openapi: 3.1.0
  info:
    title: Orders API
    version: 1.0.0
    description: Look up and delete orders.
  servers:
    - url: https://orders.example.com
  security:
    - bearerAuth: []
  paths:
    /orders/{id}:
      parameters:
        - name: id
          in: path
          required: true
          description: Order id.
          schema: {type: integer, format: int64, minimum: 1}
      get:
        operationId: getOrder
        summary: Get an order
        description: Roles admin and rep. A rep sees only own orders. Read-only, so safe to retry.
        x-prd-ids: [FR-002, AC-002.1, AC-002.2, NFR-004]
        x-error-codes: [ORDER_NOT_FOUND]
        x-preconditions: [orders/one_existing, customers/two_customers]
        x-effects: []
        responses:
          "200":
            description: The order.
            content:
              application/json:
                schema: {$ref: "#/components/schemas/Order"}
                example: {id: 1, order_key: K-1000, customer_id: 1, status: open}
          "404":
            description: No such order. Error ORDER_NOT_FOUND.
            content:
              application/json:
                schema: {$ref: "#/components/schemas/Error"}
                example: {code: ORDER_NOT_FOUND, message: Order not found}
      delete:
        operationId: deleteOrder
        summary: Delete an order
        description: Role admin only.
        x-prd-ids: [FR-003, AC-003.1, AC-003.2]
        x-error-codes: [FORBIDDEN]
        x-preconditions: [orders/one_existing, customers/two_customers]
        x-effects: ["table:orders"]
        responses:
          "204":
            description: The order is deleted.
          "403":
            description: The caller is not an admin. Error FORBIDDEN.
            content:
              application/json:
                schema: {$ref: "#/components/schemas/Error"}
                example: {code: FORBIDDEN, message: You are not allowed to do this}
  components:
    securitySchemes:
      bearerAuth: {type: http, scheme: bearer}
    schemas:
      Order:
        type: object
        required: [id, order_key, customer_id, status]
        properties:
          id: {type: integer, format: int64}
          order_key: {type: string, minLength: 1}
          customer_id: {type: integer, format: int64}
          status: {type: string, enum: [open, shipped, cancelled]}
      Error:
        type: object
        required: [code, message]
        properties:
          code: {type: string}
          message: {type: string}
contracts/permissions.yaml: |
  roles:
    admin: {identity: test-admin, secret: ORDERS_TEST_ADMIN_TOKEN}
    rep: {identity: test-rep, secret: ORDERS_TEST_REP_TOKEN}
  operations:
    getOrder: {allow: [admin, rep], deny: []}
    deleteOrder: {allow: [admin], deny: [rep]}
  row_rules:
    - role: rep
      operation: getOrder
      predicate: "orders.sales_rep_name = user.sales_rep_name"
      attribute: sales_rep_name
contracts/schema.sql: |
  CREATE TABLE customers (
    id bigint PRIMARY KEY,
    email text NOT NULL,
    name text NOT NULL
  );

  CREATE TABLE orders (
    id bigint PRIMARY KEY,
    order_key text NOT NULL UNIQUE,
    customer_id bigint NOT NULL REFERENCES customers (id),
    status text NOT NULL DEFAULT 'open' CHECK (status IN ('open', 'shipped', 'cancelled')),
    sales_rep_name text NOT NULL
  );

  COMMENT ON TABLE customers IS 'People and companies that place orders.';
  COMMENT ON COLUMN customers.id IS 'Surrogate key.';
  COMMENT ON COLUMN customers.email IS 'Contact email. PII.';
  COMMENT ON COLUMN customers.name IS 'Contact name. PII.';
  COMMENT ON TABLE orders IS 'One row per imported order.';
  COMMENT ON COLUMN orders.id IS 'Surrogate key.';
  COMMENT ON COLUMN orders.order_key IS 'Natural key from the warehouse file; unique.';
  COMMENT ON COLUMN orders.customer_id IS 'The customer who placed the order.';
  COMMENT ON COLUMN orders.status IS 'open, shipped or cancelled.';
  COMMENT ON COLUMN orders.sales_rep_name IS 'The rep who owns the order; drives the row rule for reps.';
errors.md: |
  # Error ledger

  ### E-001 Empty import file crashed the importer
  Detected: 2026-10-29, test failure in T-001.3
  Classification: code bug
  Diagnosis: the importer indexed the first row of an empty file; AC-001.3 was right
  Resolution: the importer returns status `empty` before reading rows; T-001.3 passes
  Recurrence of: -
features/api.md: |
  # API

  ### UJ-01 Rep looks up an order
  Status: live (since 1.0.0)
  Flow: 1. Rep asks for an order by id → 2. API returns it, or ORDER_NOT_FOUND.
  [ASSUMPTION A-01: Reps see only their own orders]
  Traces: FR-002, FR-003

  ### FR-002 Get an order
  Status: live (since 1.0.0)
  Flow: 1. Caller sends GET /orders/{id} → 2. API checks the role → 3. reads `orders.id`
        → 4a. found: returns it  4b. missing: returns 404
  Acceptance (EARS):
  - AC-002.1 When a rep requests an existing order through `op:getOrder`, the API shall
    return the order with its status.
  - AC-002.2 If the order id does not exist, the API shall respond 404 with error ORDER_NOT_FOUND.
  Errors: ORDER_NOT_FOUND (contracts/errors.yaml)
  Tests: T-002.1 [integration], T-002.2 [integration]  (test-cases/api.yaml)
  Traces: UJ-01; `orders.id`

  ### FR-003 Delete an order
  Status: live (since 1.0.0)
  Flow: 1. Caller sends DELETE /orders/{id} → 2. API checks the role
        → 3a. admin: deletes the row  3b. rep: refuses
  Acceptance (EARS):
  - AC-003.1 When an admin deletes an existing order through `op:deleteOrder`, the API shall
    remove the order and respond 204.
  - AC-003.2 If a rep calls `op:deleteOrder`, the API shall respond 403 with error FORBIDDEN
    and keep the order.
  Errors: FORBIDDEN (contracts/errors.yaml)
  Tests: T-003.1 [integration], T-003.2 [integration]  (test-cases/api.yaml)
  Traces: UJ-01; contracts/permissions.yaml
features/import.md: |
  # Import

  ### FR-001 Import an orders file
  Status: live (since 1.0.0)
  Flow: 1. Importer reads a file → 2. validates each row's postal code with the geocoder
        → 3. looks up orders.order_key → 4a. new: inserts  4b. exists: skips and logs
  Acceptance (EARS):
  - AC-001.1 When an imported row has a new order_key, the importer shall insert the row
    into `orders`.
  - AC-001.2 When an imported row's order_key already exists, the importer shall skip the row
    and log `IMPORT_DUPLICATE` once for it.
  - AC-001.3 If the import file is empty, the importer shall finish with status `empty`,
    log `IMPORT_EMPTY` and insert no rows.
  Errors: IMPORT_DUPLICATE, IMPORT_EMPTY (contracts/errors.yaml)
  Edge cases: the same key twice in one file → AC-001.2
  Tests: T-001.1 [integration], T-001.2 [integration], T-001.3 [unit], T-001.4 [acceptance]  (test-cases/import.yaml)
  Traces: `orders.order_key` UNIQUE; fixtures orders/one_existing, customers/two_customers
nfr.md: |
  # Non-functional requirements

  ### NFR-004 Order lookup latency
  Status: live (since 1.0.0)
  Acceptance (EARS):
  - AC-004.1 The API shall answer getOrder within 300 ms at p95 under 50 requests/s.
  Errors: -
  Tests: T-004.1 [system], T-004.2 [smoke]  (test-cases/nfr.yaml)
  Traces: UJ-01; FR-002

  ## Observability

  Log fields on every line: `timestamp`, `level`, `request_id`, `operation`, `error_code`.
  No customer email or name is ever logged.

  | Metric | Error code | Alert threshold |
  |---|---|---|
  | orders_import_duplicates_total | IMPORT_DUPLICATE | none; counted only |
  | orders_import_empty_total | IMPORT_EMPTY | any increase in 1 hour pages the owner |
  | orders_not_found_total | ORDER_NOT_FOUND | more than 50 in 5 minutes |
  | orders_forbidden_total | FORBIDDEN | more than 20 in 5 minutes |
  | geocoder_timeouts_total | GEOCODER_TIMEOUT | more than 5 in 10 minutes |
operations.md: |
  # Operations

  ## Environments

  | Environment | URL | Production |
  |---|---|---|
  | local | http://localhost:8080 | no |
  | ci | none; runs inside the pipeline | no |
  | staging | https://orders-staging.example.com | no |
  | production | https://orders.example.com | yes |

  ## Runbook

  1. Deploy to staging (actor: agent) (env: staging)
     Run: `./deploy.sh staging`
     Check: `curl -fsS https://orders-staging.example.com/health` prints `ok`
     Rollback: `./deploy.sh staging --previous`
  2. System tests on staging (actor: agent) (env: staging)
     Run: tests system, e2e
  3. Approve production (actor: human) (env: production)
     Do: read the staging results and reply "deploy production"
     Check: the reply says "deploy production"
  4. Deploy to production (actor: agent) (env: production)
     Run: `./deploy.sh production`
     Check: `curl -fsS https://orders.example.com/health` prints `ok`
     Rollback: `./deploy.sh production --previous`
  5. Smoke on production (actor: agent) (env: production)
     Run: tests smoke

  ## Deployed

  | Environment | PRD version | Commit | Date | Run |
  |---|---|---|---|---|
  | production | 1.0.0 | 3f2c1a9 | 2026-11-02 | 20261102T103000Z-production |

  ## Drift

  | Environment | Check | Introspection command |
  |---|---|---|
  | production | version | `curl -fsS https://orders.example.com/version` |
  | production | config | `curl -fsS https://orders.example.com/settings` |

  ## Secrets

  - GEOCODER_API_KEY: Secret Manager, mounted as an environment variable by `deploy.sh`.
  - ORDERS_TEST_ADMIN_TOKEN, ORDERS_TEST_REP_TOKEN: Secret Manager, staging only; the bearer tokens
    of the test-admin and test-rep identities.
prd.md: |
  ---
  prd: orders
  version: 1.0.0
  status: Approved
  owner: Sample Owner
  updated: 2026-10-29
  sql-dialect: postgres
  ---

  # Orders service

  ## 1. Metadata & stack

  - Language: Python 3.12
  - Framework: Starlette 0.41, served by uvicorn 0.32
  - Database: PostgreSQL 16, migrations by hand-written SQL
  - Hosting: Cloud Run, one service per environment
  - Repository: `github.com/example/orders`
  - Not used: message brokers, ORMs, front-end frameworks

  ## 2. Summary & goals

  The orders service imports order files from the warehouse and lets sales reps look up
  and admins delete orders through an HTTP API.

  Goals:

  - Import a 10,000-row file in under 60 seconds.
  - Answer an order lookup within 300 ms at p95.
  - Skip every duplicate row and log it, with zero duplicate orders stored.

  Personas: a sales rep (looks up own orders) and an admin (also deletes orders).

  Out of scope: order creation through the API, payments, shipping.

  ## 3. Glossary

  | Term | Meaning | Banned synonyms |
  |---|---|---|
  | order | A customer's request for goods, stored once per order_key | purchase |
  | customer | The person or company an order belongs to | client |

  ## 4. Architecture

  ```mermaid
  flowchart LR
    Importer --> DB[(PostgreSQL)]
    Importer --> Geocoder
    API --> DB
  ```

  The importer reads a file, validates postal codes with the geocoder, and writes to the
  database. The API reads and deletes orders. The geocoder is the only external service.

  ## 5. Standards registry

  | Object (glob) | Linter command | Rules live in | Applies to | Decision |
  |---|---|---|---|---|
  | `**/*.sql` | `python3 -m json.tool` | none; stand-in command for the fixture | code, schema.sql | enforced |

  ## 6. Skills registry

  | Object or activity | Skill | Decision |
  |---|---|---|
  | plans | superpowers:writing-plans | required |

  ## 7. Contract types

  | Type | Files (glob) | Validator |
  |---|---|---|
  | openapi | `contracts/openapi.yaml` | built-in |
  | schema | `contracts/schema.sql` | built-in |
  | events | `contracts/events.md` | built-in |
  | errors | `contracts/errors.yaml` | built-in |
  | permissions | `contracts/permissions.yaml` | built-in |
  | config | `contracts/config.yaml` | built-in |
  | classification | `contracts/data-classification.yaml` | built-in |
  | dependencies | `contracts/dependencies/*.yaml` | built-in |
  | fixtures | `contracts/fixtures/**` | built-in |
  | lookml | `contracts/custom/*.lkml` | `python3 -c "import sys; sys.exit(0)"` |

  ## 8. Adoption map

  Not applicable: new project.

  ## 9. Versioning

  - Breaking for the API: removing or renaming a path, field or enum value; adding a required request field.
  - Breaking for the schema: dropping or retyping a column; adding a NOT NULL column without a default.
  - Breaking for events: changing the payload shape of `import_orders` or its idempotency key.
  - Compatibility window: one minor version.
  - Migration rule: expand, then migrate, then contract.

  ## 10. Design & UI

  Not applicable: the service has no user interface.

  ## 11. Requirement index

  | ID | Title | Status | File | Since |
  |---|---|---|---|---|
  | UJ-01 | Rep looks up an order | live | features/api.md | 1.0.0 |
  | FR-001 | Import an orders file | live | features/import.md | 1.0.0 |
  | FR-002 | Get an order | live | features/api.md | 1.0.0 |
  | FR-003 | Delete an order | live | features/api.md | 1.0.0 |
  | NFR-004 | Order lookup latency | live | nfr.md | 1.0.0 |

  ## 12. Assumptions index

  | ID | Assumption | Status |
  |---|---|---|
  | A-01 | Reps see only their own orders | confirmed |

  ## 13. Open questions

  None.

  ## 14. Changelog

  | Version | Date | Change | IDs |
  |---|---|---|---|
  | 1.0.0 | 2026-10-29 | Initial release | UJ-01, FR-001, FR-002, FR-003, NFR-004 |
