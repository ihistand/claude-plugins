contracts/data-classification.yaml: |
  tables:
    customers:
      retention: 7 years after the last order
      deletion: anonymize email and name within 30 days of a request
      columns: {id: internal, email: pii, name: pii}
    orders:
      retention: 7 years
      deletion: hard delete by the deleteOrder operation
      columns: {id: internal, order_key: internal, customer_id: internal, status: internal, sales_rep_name: internal}
  masking:
    logs: customer email and name never logged; log the customer id instead
    errors: error bodies carry a code and a fixed message only
    fixtures: synthetic values only; emails use the example.com domain
contracts/dependencies/geocoder.yaml: |
  sends:
    description: One postal code per call.
    example: {postal_code: "12345", country: US}
  expects:
    description: A latitude and longitude, or a not-found flag.
    example: {found: true, lat: 40.0, lon: -75.0}
  auth:
    secret: GEOCODER_API_KEY
  limits: 50 requests/s, 100000 requests per day
  mock: tests/mocks/geocoder.py replays recorded answers; tests never call the live service
  failures:
    timeout: GEOCODER_TIMEOUT
    4xx: GEOCODER_TIMEOUT
    5xx: GEOCODER_TIMEOUT
    outage: GEOCODER_TIMEOUT
contracts/errors.yaml: |
  IMPORT_DUPLICATE:
    meaning: An imported row's order_key already exists.
    when: The importer finds the key in orders, or earlier in the same file.
    status: 0
    message: Row skipped because the order already exists.
    log_level: warning
    retryable: false
    metric: orders_import_duplicates_total
  IMPORT_EMPTY:
    meaning: The import file holds no rows.
    when: The file is zero bytes or has only a header line.
    status: 0
    message: The import file is empty; nothing was imported.
    log_level: warning
    retryable: false
    metric: orders_import_empty_total
  ORDER_NOT_FOUND:
    meaning: No order has the requested id.
    when: getOrder receives an id that is not in orders.
    status: 404
    message: Order not found
    log_level: info
    retryable: false
    metric: orders_not_found_total
  FORBIDDEN:
    meaning: The caller's role may not perform the operation.
    when: A rep calls deleteOrder.
    status: 403
    message: You are not allowed to do this
    log_level: warning
    retryable: false
    metric: orders_forbidden_total
  GEOCODER_TIMEOUT:
    meaning: The geocoder did not answer in time or failed.
    when: A geocoder call times out, returns 4xx or 5xx, or the service is down.
    status: 504
    message: Address check is unavailable; try again later.
    log_level: error
    retryable: true
    metric: geocoder_timeouts_total
contracts/events.md: |
  # Events and jobs

  ### import_orders
  Trigger: a file arrives in the staging bucket, or an operator starts the job by hand.
  Payload: `{"file": "<bucket path>", "rows": [{"order_key": "K-3000", "customer_id": 1, "status": "open", "sales_rep_name": "rep-a"}]}`; the example above carries one row.
  Delivery: at least once; ordering is not guaranteed between files, rows keep file order.
  Retries: 3 attempts, 30 s apart; the idempotency key is order_key, so a retry skips rows already stored.
  Failure: after 3 failed attempts the file moves to the dead-letter folder and the owner is paged.
