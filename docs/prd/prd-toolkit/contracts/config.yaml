# Format: references/prd-format.md, "Contract YAML shapes".
# Required content per setting: NAME, `type`, `default`, `environments` (a value per environment),
# and `owner` (who may change it).
settings:
  PRD_LINT_CI:
    type: string
    default: unset
    environments: {local: unset, production: unset}
    owner: "[NEEDS CLARIFICATION: who may change PRD_LINT_CI; prd_lint.py --ci sets it to 1]"
